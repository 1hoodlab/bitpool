[workspace]
members = [".", "migration"]

[package]
name = "bitpool"
version = "0.1.0"
edition = "2021"

[dependencies]
actix = "0.13.5"
actix-web = "4.12.1"
actix-web-actors = "4.3.1"
async-trait = "0.1.89"
dotenvy = "0.15"
env_logger = "0.11.9"
log = "0.4"
sea-orm = { version = "1.1.19", features = ["sqlx-postgres", "runtime-tokio-native-tls", "macros"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
migration = { path = "migration" }
