[workspace]
members = [".", "migration"]

[package]
name = "bitpool"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.89"
dotenvy = "0.15"
env_logger = "0.11.9"
log = "0.4"
sea-orm = { version = "1.1.19", features = ["sqlx-postgres", "runtime-tokio-native-tls", "macros"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
migration = { path = "migration" }
actix-web = "4.13.0"
uuid = { version = "1.21.0", features = ["v4", "serde"] }
thiserror = "2.0.18"
reqwest = { version = "0.13.2", features = ["json"] }
rand = "0.8.5"
